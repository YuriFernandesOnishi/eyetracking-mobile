// Modeled on react-native-vision-camera's own android/build.gradle (a
// real, working Nitro-module Gradle setup) -- adapted to this package's
// name and its one extra native dependency (MediaPipe tasks-vision).
// UNVERIFIED: this could not be run through an actual Gradle/Android
// build in this environment (no Android SDK/NDK here). Sanity-check the
// exact `compileSdkVersion`/`ndkVersion` extension names and the prefab
// packaging excludes against whatever Expo's prebuilt android/ project
// actually defines at build time.

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply from: "../nitrogen/generated/android/FaceLandmarker+autolinking.gradle"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["FaceLandmarker_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["FaceLandmarker_" + name]).toInteger()
}

android {
  namespace "com.margelo.nitro.facelandmarker"

  ndkVersion getExtOrDefault("ndkVersion")
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared"
        abiFilters (*reactNativeArchitectures())
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  buildFeatures {
    buildConfig true
    prefab true
    prefabPublishing true
  }

  prefab {
    FaceLandmarker {
      headers "src/main/cpp"
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  packagingOptions {
    excludes = [
      "META-INF",
      "META-INF/**",
      "**/libc++_shared.so",
      "**/libNitroModules.so",
      "**/libfbjni.so",
      "**/libjsi.so",
    ]
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  implementation "com.facebook.react:react-native:+"
  implementation project(":react-native-nitro-modules")

  // MediaPipe FaceLandmarker (iris-refined face mesh). Version pinned to
  // the latest confirmed available at implementation time -- check
  // https://mvnrepository.com/artifact/com.google.mediapipe/tasks-vision
  // for anything newer before shipping.
  implementation "com.google.mediapipe:tasks-vision:0.10.29"
}

tasks.register('prepareHeaders', Copy) {
  from fileTree('./src/main/cpp').filter { it.isFile() }
  from fileTree('../nitrogen/generated/android/c++/').filter { it.isFile() }
  from fileTree('../nitrogen/generated/shared/c++/').filter { it.isFile() }
  include "*.hpp"
  into "${project.buildDir}/headers/FaceLandmarker/FaceLandmarker/"
  includeEmptyDirs = false
}

preBuild.dependsOn(prepareHeaders)
